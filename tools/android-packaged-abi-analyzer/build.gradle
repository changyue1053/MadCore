plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation('org.jetbrains.kotlin:abi-tools') {
        version { strictly '2.3.21' }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

application {
    mainClass = 'PackagedAarAbi'
}
