import org.jetbrains.kotlin.gradle.plugin.mpp.apple.XCFrameworkConfig

kotlin {
    sourceSets {
        commonMain.dependencies {
            api project(':core-extension')
            api project(':core-time')
            api project(':core-json')
            api project(':core-logging')
            api project(':core-config')
            api project(':core-net')
        }
    }
    if (providers.gradleProperty('madcore.target').getOrElse('jvm') == 'ios') {
        def framework = new XCFrameworkConfig(project, 'MadCore')
        targets.matching { it.name in ['iosArm64', 'iosSimulatorArm64'] }.configureEach {
            binaries.framework {
                baseName = 'MadCore'
                isStatic = true
                export project(':core-extension')
                export project(':core-time')
                export project(':core-json')
                export project(':core-logging')
                export project(':core-config')
                export project(':core-net')
                framework.add(it)
            }
        }
    }
    if (providers.gradleProperty('madcore.target').getOrElse('jvm') == 'ohos') {
        targets.getByName('ohosArm64').binaries.sharedLib {
            baseName = 'madcore'
        }
    }

}
