import org.gradle.work.DisableCachingByDefault
import org.jetbrains.kotlin.gradle.plugin.mpp.apple.XCFrameworkConfig

@DisableCachingByDefault(because = 'Writes one small Kotlin source file')
abstract class GenerateMadCoreVersion extends DefaultTask {
    @Input
    abstract Property<String> getSdkVersion()

    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getSourceTemplate()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void generate() {
        def token = '@MADCORE_VERSION@'
        def template = sourceTemplate.get().asFile.getText('UTF-8')
        if (template.count(token) != 1) {
            throw new GradleException('Expected one SDK version token in MadCoreInfo.kt.template')
        }
        def source = outputDirectory.file('com/mad/core/MadCoreInfo.kt').get().asFile
        java.nio.file.Files.createDirectories(source.parentFile.toPath())
        // Root project validates the version using an ASCII-only, source-safe grammar.
        source.setText(template.replace(token, sdkVersion.get()), 'UTF-8')
    }
}

def generatedVersion = tasks.register('generateMadCoreVersion', GenerateMadCoreVersion) {
    sdkVersion.set(project.version.toString())
    sourceTemplate.set(layout.projectDirectory.file('version-template/MadCoreInfo.kt.template'))
    outputDirectory.set(layout.buildDirectory.dir('generated/madcoreInfo/commonMain'))
}

kotlin {
    sourceSets {
        // Gradle carries the producer task dependency with this source dir.
        // Use the long-standing source-set API on both official and forked KGP.
        commonMain.kotlin.srcDir(generatedVersion)
        commonMain.dependencies {
            api project(':core-extension')
            api project(':core-time')
            api project(':core-json')
            api project(':core-logging')
            api project(':core-config')
            api project(':core-net')
            api project(':core-storage')
            api project(':core-lifecycle')
        }
    }
    if (providers.gradleProperty('madcore.target').getOrElse('jvm') == 'ios') {
        def framework = new XCFrameworkConfig(project, 'MadCore')
        targets.matching { it.name in ['iosArm64', 'iosSimulatorArm64'] }.configureEach {
            binaries.framework {
                baseName = 'MadCore'
                isStatic = true
                export project(':core-extension')
                export project(':core-time')
                export project(':core-json')
                export project(':core-logging')
                export project(':core-config')
                export project(':core-net')
                export project(':core-storage')
                export project(':core-lifecycle')
                framework.add(it)
            }
        }
    }
    if (providers.gradleProperty('madcore.target').getOrElse('jvm') == 'ohos') {
        if (providers.gradleProperty('madcore.copiedHttp').getOrElse('false') == 'true') {
            sourceSets.getByName('ohosArm64Main').kotlin.srcDir('src/ohosCopiedHttp/kotlin')
        }
        targets.getByName('ohosArm64').binaries.sharedLib {
            baseName = 'madcore'
            // Hide compiler runtime/C adapter internals and discard executable startup roots.
            // A shared SDK must not retain Scrt1.o's unresolved `main` dependency.
            def copiedHttp = providers.gradleProperty('madcore.copiedHttp').getOrElse('false') == 'true'
            def exportsMap = rootProject.file(copiedHttp ? 'harmony/experimental/copied-http/exports.map' : 'harmony/native/madcore.exports.map')
            def startupScript = rootProject.file('harmony/native/shared-library-startup.ld')
            linkerOpts('--version-script=' + exportsMap.absolutePath, '--script=' + startupScript.absolutePath, '--no-undefined')
            linkTaskProvider.configure { inputs.files(exportsMap, startupScript) }
        }
    }

}
