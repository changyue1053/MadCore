pluginManagement {
    def ohos = providers.gradleProperty('madcore.target').getOrElse('jvm') == 'ohos'
    repositories {
        if (ohos) maven {
            url = uri('https://maven.eazytec-cloud.com/nexus/repository/maven-public/')
            content { includeVersionByRegex('.*', '.*', '.+-[0-9]+\\.[0-9]+\\.[0-9]+') }
        }
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    plugins {
        id 'org.jetbrains.kotlin.multiplatform' version (ohos ? '2.2.21-1.0.0' : '2.2.21')
        id 'com.android.library' version '8.13.2'
    }
}
rootProject.name = 'MadCore'
include 'core-extension', 'core-time', 'core-json'
include 'madcore'
include 'core-testkit'
include 'core-logging'
include 'core-config'
include 'core-net'
include 'core-storage'
include 'core-lifecycle'
