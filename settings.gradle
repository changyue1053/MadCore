pluginManagement {
    def ohos = providers.gradleProperty('madcore.target').getOrElse('jvm') == 'ohos'
    // Reject this probe before resolving the paused Harmony compiler fork.
    def abiProbe = providers.gradleProperty('madcore.abiProbe').getOrElse('false')
    if (!(abiProbe in ['true', 'false']) || (abiProbe == 'true' && ohos)) {
        throw new GradleException('madcore.abiProbe must be true/false and is unavailable for the paused ohos target')
    }
    repositories {
        if (ohos) maven {
            url = uri('https://maven.eazytec-cloud.com/nexus/repository/maven-public/')
            content { includeVersionByRegex('.*', '.*', '.+-[0-9]+\\.[0-9]+\\.[0-9]+') }
        }
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    plugins {
        id 'org.jetbrains.kotlin.multiplatform' version (ohos ? '2.2.21-1.0.0' : '2.2.21')
    }
}
rootProject.name = 'MadCore'
include 'core-extension', 'core-time', 'core-json'
include 'madcore'
include 'core-testkit'
include 'core-logging'
include 'core-config'
include 'core-net'
include 'core-storage'
include 'core-lifecycle'
