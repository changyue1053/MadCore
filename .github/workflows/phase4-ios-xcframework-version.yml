name: Rehearse full iOS XCFramework version (one Draft transition)
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths: ['.github/workflows/phase4-ios-xcframework-version.yml']
permissions:
  contents: read
jobs:
  ios:
    name: Full iOS XCFramework version (simulator only)
    if: >-
      github.repository == 'changyue1053/MadCore' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft &&
      github.event.pull_request.number == 1 &&
      github.event.before == '0540aed86184de932545c9ff8ab22143a203c01b' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'work/core-validation-testkit'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test version match and mismatch on one disposable simulator
        shell: bash
        run: bash tools/rehearse_ios_xcframework_version.sh
