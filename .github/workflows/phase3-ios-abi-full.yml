name: Compare full iOS ABI (one Draft transition)
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths: ['.github/workflows/phase3-ios-abi-full.yml']
permissions:
  contents: read
jobs:
  ios:
    name: Full iOS ABI (compiler only)
    if: >-
      github.repository == 'changyue1053/MadCore' &&
      github.event.pull_request.draft &&
      github.event.pull_request.number == 1 &&
      github.event.before == '57adc6232dbb43605f3f2ff43287fc15772f96fc' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'work/core-validation-testkit'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 5
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Compare compiled Kotlin dumps on the same Apple SDKs
        shell: bash
        run: bash tools/run_ios_full_abi_comparison.sh
