name: Validate foundation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 tools/check_source_boundary.py
      - run: python3 tools/test_http_fixture.py
      - run: python3 tools/test_tls_fixture.py
      - name: Test native bridge memory/error paths with host stubs (not device execution)
        run: bash tools/test_native_bridge.sh
      - name: Test Harmony HTTP policy and mocked state (not device execution)
        run: |
          node --version
          node --experimental-transform-types tools/test_harmony_http_policy.mjs
          node --experimental-transform-types tools/test_harmony_rcp_adapter.mjs
          node --experimental-transform-types tools/test_harmony_storage.mjs
      - run: ./gradlew --no-daemon -Pmadcore.target=jvm jvmTest publishAllPublicationsToStagingRepository
      - name: Consume only published artifacts from outside the checkout
        shell: bash
        run: |
          consumer=$(mktemp -d)
          cp -R examples/jvm-consumer/. "$consumer/"
          ./gradlew --no-daemon -p "$consumer" -PmadcoreRepository="$GITHUB_WORKSPACE/build/staging-repository" run
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon -Pmadcore.target=android assembleRelease publishAllPublicationsToStagingRepository
      - name: Verify release AARs exist
        run: |
          for module in core-extension core-time core-json core-testkit core-logging core-config core-net core-storage core-lifecycle madcore; do
            test -s "$module/build/outputs/aar/$module-release.aar"
          done
      - name: Test an independent Android app on a managed emulator
        timeout-minutes: 25
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          consumer=$(mktemp -d)
          cp -R examples/android-consumer/. "$consumer/"
          python3 tools/http_fixture.py --tls > "$RUNNER_TEMP/android-http-fixture.log" 2>&1 &
          fixture=$!
          trap 'kill "$fixture" || true' EXIT
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:18082/ok
          ./gradlew --no-daemon -p "$consumer" -PmadcoreRepository="$GITHUB_WORKSPACE/build/staging-repository" :app:assembleDebug :app:pixel2api30DebugAndroidTest
          python3 tools/check_android_results.py "$consumer/app/build/outputs/androidTest-results"
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: bash tools/build_ios_xcframework.sh
      - name: Verify slices and typecheck a separate Swift consumer
        shell: bash
        run: |
          xc=madcore/build/XCFrameworks/release/MadCore.xcframework
          test -s "$xc/Info.plist"
          test -s "$xc/ios-arm64/MadCore.framework/MadCore"
          test -s "$xc/ios-arm64-simulator/MadCore.framework/MadCore"
          consumer=$(mktemp -d)
          cp examples/ios-consumer/Consumer.swift "$consumer/Consumer.swift"
          xcrun --sdk iphonesimulator swiftc -typecheck -target arm64-apple-ios15.0-simulator -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -F "$xc/ios-arm64-simulator" "$consumer/Consumer.swift"
      - name: Run native and independent iOS host behavior tests
        timeout-minutes: 15
        shell: bash
        run: |
          python3 tools/http_fixture.py --tls > "$RUNNER_TEMP/http-fixture.log" 2>&1 &
          fixture=$!
          trap 'kill "$fixture" || true' EXIT
          export MADCORE_IOS_SIMULATOR_UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          xcrun simctl boot "$MADCORE_IOS_SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$MADCORE_IOS_SIMULATOR_UDID" -b
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:18082/ok
          ./gradlew --no-daemon -Pmadcore.target=ios :core-net:iosSimulatorArm64Test :core-storage:iosSimulatorArm64Test :core-lifecycle:iosSimulatorArm64Test
          python3 tools/check_ios_http_results.py
          python3 tools/check_ios_storage_results.py
          python3 tools/check_ios_lifecycle_results.py
          bash tools/test_ios_host.sh
  harmony-native-har:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install fork linker runtime dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2
      - name: Check pinned fork marker is reachable (no credentials)
        run: curl --fail --location --connect-timeout 20 --max-time 60 --output /dev/null 'https://maven.eazytec-cloud.com/nexus/repository/maven-public/org/jetbrains/kotlin/multiplatform/org.jetbrains.kotlin.multiplatform.gradle.plugin/2.2.21-1.0.0/org.jetbrains.kotlin.multiplatform.gradle.plugin-2.2.21-1.0.0.pom'
      - name: Probe fork toolchain and compile only (not HAR or device support)
        run: ./gradlew --no-daemon -Pmadcore.target=ohos compileKotlinOhosArm64 :madcore:linkReleaseSharedOhosArm64
      - name: Verify independent C ABI library (not device execution)
        shell: bash
        run: |
          so=madcore/build/bin/ohosArm64/releaseShared/libmadcore.so
          test -s "$so"
          readelf -h "$so" | grep AArch64
          for symbol in madcore_abi_version madcore_epoch_millis madcore_json_object_valid; do
            readelf --dyn-syms --wide "$so" | grep -w "$symbol"
          done
          echo 'Inspect available NAPI build prerequisites for next stage'
          find "$HOME/.konan/dependencies" -name native_api.h -o -name libace_napi.z.so -o -name clang++
      - name: Compile standalone NAPI bridge against pinned sysroot
        run: bash tools/build_harmony_napi.sh
      - name: Build HAR and separate ArkTS consumer with authorized official CLI
        timeout-minutes: 20
        run: bash tools/build_harmony_har.sh
