name: Validate foundation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 tools/check_source_boundary.py
      - run: python3 tools/test_http_fixture.py
      - run: python3 tools/test_tls_fixture.py
      - run: python3 tools/test_jvm_classpath.py
      - run: python3 tools/test_publication_graph.py
      - run: python3 tools/test_harmony_binary_inventory.py
      - run: python3 tools/test_upper_aars.py
      - run: python3 tools/test_android_maven_consumer_modes.py
      - run: python3 tools/test_android_api24_license.py
      - run: python3 tools/test_harmony_composition.py
      - run: python3 tools/test_result_gate_tests.py && python3 -O tools/test_result_gate_tests.py
      - run: python3 tools/test_ios_host_runner.py && python3 -O tools/test_ios_host_runner.py
      - name: Test opt-in copied HTTP registry (host only)
        run: bash harmony/experimental/copied-http/test_host.sh
      - name: Test experimental async ownership contract (host only)
        run: bash tools/test_async_contract.sh
      - name: Test native bridge memory/error paths with host stubs (not device execution)
        run: bash tools/test_native_bridge.sh
      - name: Test Harmony HTTP policy and mocked state (not device execution)
        run: |
          node --version
          node --experimental-transform-types tools/test_harmony_http_policy.mjs
          node --experimental-transform-types tools/test_harmony_rcp_adapter.mjs
          node --experimental-transform-types tools/test_harmony_storage.mjs
          node --experimental-transform-types tools/test_harmony_namespaced_storage.mjs
          node --experimental-transform-types tools/test_harmony_lifecycle.mjs
          node --experimental-transform-types tools/test_copied_http_driver.mjs
      - run: ./gradlew --no-daemon -Pmadcore.target=jvm jvmTest publishAllPublicationsToStagingRepository
      - run: python3 tools/check_publication_graph.py build/staging-repository/jvm
      - name: Consume only published artifacts from outside the checkout
        shell: bash
        run: |
          consumer=$(mktemp -d)
          cp -R examples/jvm-consumer/. "$consumer/"
          ./gradlew --no-daemon -p "$consumer" -PmadcoreRepository="$GITHUB_WORKSPACE/build/staging-repository/jvm" run writeRuntimeClasspath
          python3 tools/check_jvm_classpath.py "$consumer/runtime-classpath.json"
      - name: Verify the JVM ABI candidate detects compiled drift (no adopted baseline)
        timeout-minutes: 8
        shell: bash
        run: bash tools/test_jvm_abi_candidate.sh
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon -Pmadcore.target=android assembleRelease publishAllPublicationsToStagingRepository
      - run: python3 tools/check_publication_graph.py build/staging-repository/android
      - name: Verify release AARs exist
        run: |
          for module in core-extension core-time core-json core-testkit core-logging core-config core-net core-storage core-lifecycle madcore; do
            test -s "$module/build/outputs/aar/$module-release.aar"
          done
      - name: Build the independent host and instrumentation APKs (no device)
        timeout-minutes: 8
        shell: bash
        run: bash tools/test_android_maven_consumer.sh "$GITHUB_WORKSPACE/build/staging-repository/android" --build-only
      - name: Test an independent Maven Android app on a managed emulator
        timeout-minutes: 25
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          bash tools/test_android_maven_consumer.sh "$GITHUB_WORKSPACE/build/staging-repository/android"
      - name: Probe the documented Android minimum on a separate API24 AVD
        # First acceptance only on the same-repository MadCore Draft branch.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/core-validation-testkit'
        timeout-minutes: 20
        shell: bash
        run: bash tools/test_android_api24.sh "$GITHUB_WORKSPACE/build/staging-repository/android"
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: bash tools/build_ios_xcframework.sh
      - name: Verify slices and typecheck a separate Swift consumer
        shell: bash
        run: |
          xc=madcore/build/XCFrameworks/release/MadCore.xcframework
          test -s "$xc/Info.plist"
          test -s "$xc/ios-arm64/MadCore.framework/MadCore"
          test -s "$xc/ios-arm64-simulator/MadCore.framework/MadCore"
          consumer=$(mktemp -d)
          cp examples/ios-consumer/Consumer.swift "$consumer/Consumer.swift"
          xcrun --sdk iphonesimulator swiftc -typecheck -target arm64-apple-ios15.0-simulator -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -F "$xc/ios-arm64-simulator" "$consumer/Consumer.swift"
      - name: Link native behavior tests before simulator startup
        run: ./gradlew --no-daemon -Pmadcore.target=ios :core-net:linkDebugTestIosSimulatorArm64 :core-storage:linkDebugTestIosSimulatorArm64 :core-lifecycle:linkDebugTestIosSimulatorArm64
      - name: Build two published Kotlin upper libraries and one iOS umbrella
        id: kotlin_umbrella_build
        shell: bash
        run: |
          ./gradlew --no-daemon -Pmadcore.target=ios :core-storage:publishAllPublicationsToStagingRepository
          bash tools/test_ios_kotlin_composition.sh build "$GITHUB_WORKSPACE/build/staging-repository/ios" "$RUNNER_TEMP/kotlin-composition"
      - name: Start TLS fixture before simulator boot
        timeout-minutes: 2
        shell: bash
        run: |
          python3 tools/http_fixture.py --tls > "$RUNNER_TEMP/http-fixture.log" 2>&1 &
          fixture=$!
          echo "MADCORE_FIXTURE_PID=$fixture" >> "$GITHUB_ENV"
          if ! curl --fail --retry 5 --retry-connrefused http://127.0.0.1:18082/ok; then
            if kill -0 "$fixture" 2>/dev/null; then echo 'Fixture process alive but not ready'; else echo 'Fixture process exited before readiness'; fi
            tail -n 80 "$RUNNER_TEMP/http-fixture.log"
            exit 1
          fi
      - name: Boot iOS simulator (separate bounded infrastructure stage)
        id: ios_boot
        timeout-minutes: 10
        shell: bash
        run: |
          MADCORE_IOS_SIMULATOR_UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          xcrun simctl boot "$MADCORE_IOS_SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$MADCORE_IOS_SIMULATOR_UDID" -b
          xcodebuild -version
          xcrun simctl list devices available -j | python3 -c '
          import json, sys
          udid = sys.argv[1]
          matches = [(runtime, device) for runtime, devices in json.load(sys.stdin)["devices"].items()
                     for device in devices if device.get("udid") == udid]
          if len(matches) != 1 or matches[0][1].get("state") != "Booted":
              sys.exit("Expected exactly one booted simulator matching the chosen UDID")
          runtime, device = matches[0]
          model = device["name"]
          print(f"MadCore iOS simulator: runtime={runtime}; model={model}; udid={udid}")
          ' "$MADCORE_IOS_SIMULATOR_UDID"
          echo "MADCORE_IOS_SIMULATOR_UDID=$MADCORE_IOS_SIMULATOR_UDID" >> "$GITHUB_ENV"
      - name: Run native and independent iOS host behavior tests
        timeout-minutes: 15
        shell: bash
        run: |
          kill -0 "$MADCORE_FIXTURE_PID"
          curl --fail http://127.0.0.1:18082/tls-ready
          ./gradlew --no-daemon -Pmadcore.target=ios :core-net:iosSimulatorArm64Test :core-storage:iosSimulatorArm64Test :core-lifecycle:iosSimulatorArm64Test
          python3 tools/check_ios_http_results.py
          python3 tools/check_ios_storage_results.py
          python3 tools/check_ios_lifecycle_results.py
          bash tools/test_ios_host.sh
      - name: Run independent Kotlin umbrella host
        if: ${{ !cancelled() && steps.kotlin_umbrella_build.outcome == 'success' && steps.ios_boot.outcome == 'success' }}
        timeout-minutes: 4
        run: bash tools/test_ios_kotlin_composition.sh run "$RUNNER_TEMP/kotlin-composition"
      - name: Stop private HTTP/TLS fixture
        if: always()
        shell: bash
        run: |
          if [ -n "${MADCORE_FIXTURE_PID:-}" ]; then kill "$MADCORE_FIXTURE_PID" 2>/dev/null || true; fi
  harmony-native-har:
    # Paused pending exact SDK/toolchain license applicability review for a reusable SDK.
    # Keep prior evidence; restore only after review. Skipped is not fresh Harmony validation.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install fork linker runtime dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2
      - name: Check pinned fork marker is reachable (no credentials)
        run: curl --fail --location --connect-timeout 20 --max-time 60 --output /dev/null 'https://maven.eazytec-cloud.com/nexus/repository/maven-public/org/jetbrains/kotlin/multiplatform/org.jetbrains.kotlin.multiplatform.gradle.plugin/2.2.21-1.0.0/org.jetbrains.kotlin.multiplatform.gradle.plugin-2.2.21-1.0.0.pom'
      - name: Probe fork toolchain and compile only (not HAR or device support)
        shell: bash
        run: |
          if ! ./gradlew --no-daemon -Pmadcore.target=ohos compileKotlinOhosArm64 :madcore:linkReleaseSharedOhosArm64; then
            # Same-runner evidence for previously missing public POMs; no fallback or retry.
            for path in com/google/code/gson/gson/2.11.0/gson-2.11.0.pom org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.8.0/kotlinx-coroutines-core-jvm-1.8.0.pom; do
              for method in HEAD GET; do
                curl --silent --show-error --request "$method" --connect-timeout 10 --max-time 20 --output /dev/null --write-out "$method $path HTTP %{http_code}\n" "https://repo.maven.apache.org/maven2/$path" || true
              done
            done
            exit 1
          fi
      - name: Verify independent C ABI library (not device execution)
        shell: bash
        run: |
          so=madcore/build/bin/ohosArm64/releaseShared/libmadcore.so
          test -s "$so"
          readelf -h "$so" | grep AArch64
          for symbol in madcore_abi_version madcore_epoch_millis madcore_json_object_valid; do
            readelf --dyn-syms --wide "$so" | grep -w "$symbol"
          done
          echo 'Inspect available NAPI build prerequisites for next stage'
          find "$HOME/.konan/dependencies" -name native_api.h -o -name libace_napi.z.so -o -name clang++
      - name: Compile standalone NAPI bridge against pinned sysroot
        run: bash tools/build_harmony_napi.sh
      - name: Build HAR and separate ArkTS consumer with authorized official CLI
        timeout-minutes: 20
        run: bash tools/build_harmony_har.sh

      - name: Build opt-in copied RCP bridge (compile only, not device execution)
        run: |
          so=madcore/build/bin/ohosArm64/releaseShared/libmadcore.so
          if readelf --dyn-syms --wide "$so" | grep -E 'mc_http_|madcore_copied_http'; then
            echo 'Experimental API leaked into default build' >&2; exit 1
          fi
          ./gradlew --no-daemon -Pmadcore.target=ohos -Pmadcore.copiedHttp=true :madcore:linkReleaseSharedOhosArm64
          python3 tools/check_copied_http_link.py "$so"
          bash tools/build_copied_http_bridge.sh
          MADCORE_COPIED_HTTP=1 bash tools/build_harmony_har.sh
