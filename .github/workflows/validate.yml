name: Validate foundation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 tools/check_source_boundary.py
      - run: ./gradlew --no-daemon -Pmadcore.target=jvm jvmTest publishAllPublicationsToStagingRepository
      - name: Consume only published artifacts from outside the checkout
        shell: bash
        run: |
          consumer=$(mktemp -d)
          cp -R examples/jvm-consumer/. "$consumer/"
          ./gradlew --no-daemon -p "$consumer" -PmadcoreRepository="$GITHUB_WORKSPACE/build/staging-repository" run
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon -Pmadcore.target=android assembleRelease
      - name: Verify release AARs exist
        run: |
          for module in core-extension core-time core-json core-testkit core-logging madcore; do
            test -s "$module/build/outputs/aar/$module-release.aar"
          done
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon -Pmadcore.target=ios :madcore:assembleMadCoreReleaseXCFramework
      - name: Verify slices and typecheck a separate Swift consumer
        shell: bash
        run: |
          xc=madcore/build/XCFrameworks/release/MadCore.xcframework
          test -s "$xc/Info.plist"
          test -s "$xc/ios-arm64/MadCore.framework/MadCore"
          test -s "$xc/ios-arm64-simulator/MadCore.framework/MadCore"
          consumer=$(mktemp -d)
          printf 'import MadCore\nlet version: String = MadCoreInfo.shared.version\n' > "$consumer/Consumer.swift"
          xcrun --sdk iphonesimulator swiftc -typecheck -target arm64-apple-ios15.0-simulator -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -F "$xc/ios-arm64-simulator" "$consumer/Consumer.swift"
  harmony-klib-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Check pinned fork marker is reachable (no credentials)
        run: curl --fail --location --connect-timeout 20 --max-time 60 --output /dev/null 'https://maven.eazytec-cloud.com/nexus/repository/maven-public/org/jetbrains/kotlin/multiplatform/org.jetbrains.kotlin.multiplatform.gradle.plugin/2.2.21-1.0.0/org.jetbrains.kotlin.multiplatform.gradle.plugin-2.2.21-1.0.0.pom'
      - name: Probe fork toolchain and compile only (not HAR or device support)
        run: ./gradlew --no-daemon -Pmadcore.target=ohos compileKotlinOhosArm64
