name: Rehearse MadCore immutable JVM staging (one Draft transition)
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths: ['.github/workflows/immutable-maven-jvm.yml']
permissions:
  contents: read
concurrency:
  group: madcore-immutable-jvm-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  jvm-immutable:
    if: >-
      github.repository == 'changyue1053/MadCore' &&
      github.event.pull_request.number == 1 &&
      github.event.pull_request.draft &&
      github.event.before == '66a4789c14c1e9dfd5d3c7118ca90effc8c4e8b7' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'work/core-validation-testkit'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify one exact, scoped Draft transition
        id: scope
        shell: bash
        run: |
          base=66a4789c14c1e9dfd5d3c7118ca90effc8c4e8b7
          if [[ "$(git show -s --format=%P HEAD)" != "$base" ]]; then
            echo 'MADCORE_IMMUTABLE_JVM_STAGE=scope RESULT=skipped REASON=unexpected-parent'
            exit 0
          fi
          expected=$(printf '%s\n' \
            .github/workflows/immutable-maven-jvm.yml \
            .github/workflows/phase3-ios-abi-baseline.yml \
            docs/IMMUTABLE_MAVEN_REHEARSAL.md \
            tools/probe_ios_abi_baseline.sh \
            tools/rehearse_immutable_maven.py \
            tools/rehearse_immutable_maven.sh \
            tools/rehearse_immutable_maven_ci.sh \
            tools/test_immutable_maven_rehearsal.py)
          if [[ "$(git diff --no-renames --name-status "$base" HEAD | awk -F '\t' '$1 == "A" {print $2; next} { print "UNEXPECTED" }')" != "$expected" ]]; then
            echo 'MADCORE_IMMUTABLE_JVM_STAGE=scope RESULT=failed REASON=unexpected-paths'
            exit 1
          fi
          echo 'eligible=true' >> "$GITHUB_OUTPUT"
          echo 'MADCORE_IMMUTABLE_JVM_STAGE=scope RESULT=passed'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.scope.outputs.eligible == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Cold local staging and independent JVM consumer
        shell: bash
        if: steps.scope.outputs.eligible == 'true'
        run: bash tools/rehearse_immutable_maven_ci.sh
