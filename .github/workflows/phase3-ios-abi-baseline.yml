name: Diagnose MadCore iOS baseline ABI (one Draft transition)
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths: ['.github/workflows/phase3-ios-abi-baseline.yml']
permissions:
  contents: read
jobs:
  ios-baseline-probe:
    if: >-
      github.repository == 'changyue1053/MadCore' &&
      github.event.pull_request.draft &&
      github.event.pull_request.number == 1 &&
      github.event.before == '66a4789c14c1e9dfd5d3c7118ca90effc8c4e8b7' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'work/core-validation-testkit'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 4
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Diagnose exact cold iOS baseline without raw logs
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 66a4789c14c1e9dfd5d3c7118ca90effc8c4e8b7
          test "$(git rev-parse HEAD^^^)" = 9555b58b3af91165e4a1a2a8db02ba3c1903c24a
          expected=$(printf '%s\n' .github/workflows/immutable-maven-jvm.yml .github/workflows/phase3-ios-abi-baseline.yml docs/IMMUTABLE_MAVEN_REHEARSAL.md tools/probe_ios_abi_baseline.sh tools/rehearse_immutable_maven.py tools/rehearse_immutable_maven.sh tools/rehearse_immutable_maven_ci.sh tools/test_immutable_maven_rehearsal.py)
          test "$(git diff --no-renames --name-status HEAD^ HEAD | awk -F '\t' '$1 == "A" { print $2; next } { print "UNEXPECTED" }')" = "$expected"
          bash tools/probe_ios_abi_baseline.sh
